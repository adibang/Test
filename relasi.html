<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSPLUS - Manajemen Relasi</title>
    <link rel="stylesheet" href="css/app.css">
    <style>
        /* Gaya tambahan khusus untuk halaman relasi jika diperlukan */
        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .page-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .page-header h2 {
            color: #006B54;
            font-size: 1.5rem;
            margin: 0;
        }
        .page-content {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
        }
        .data-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        .data-table tr:hover {
            background: #f9f9f9;
        }
        .action-btn {
            width: 32px;
            height: 32px;
            min-height: 32px;
            padding: 0;
            margin: 0 2px;
        }
        .action-btn svg {
            width: 18px;
            height: 18px;
        }
        #customer-list-container,
        #supplier-list-container {
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            margin-top: 10px;
        }
        #customer-list-container table,
        #supplier-list-container table {
            min-width: 600px;
        }
        #customer-list-container thead th,
        #supplier-list-container thead th {
            position: sticky;
            top: 0;
            background: #f5f5f5;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- Header sederhana -->
    <header class="app-header">
        <div class="header-content">
            <div class="app-title">
                <button class="back-button" onclick="window.location.href='index.html'" title="Kembali ke Beranda">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <svg class="icon box-icon icon-primary" viewBox="0 0 24 24">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                    <line x1="12" y1="22.08" x2="12" y2="12"/>
                </svg>
                <span>Manajemen Relasi</span>
            </div>
            <div class="header-actions">
                <span id="user-name-display"></span>
                <button onclick="logout()">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Konten dinamis -->
    <main class="main-content" id="relasi-content">
        <!-- Diisi oleh JavaScript -->
    </main>

    <!-- Notifikasi -->
    <div id="notification"></div>

    <!-- Scripts -->
    <script src="js/constants.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/globals.js"></script>
    <script src="js/database.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/relasi.js"></script>
</body>
</html>
