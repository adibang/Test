<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSPLUS - Manajemen Relasi</title>
    <link rel="stylesheet" href="css/app.css">
    <style>
        /* gaya sama seperti sebelumnya */
    </style>
</head>
<body>
    <!-- header sama -->
    <header class="app-header">...</header>

    <div id="debug-error" style="display:none; background:#ffdddd; padding:10px; margin:10px; border:1px solid red;"></div>
    <main class="main-content" id="relasi-content"></main>
    <div id="notification"></div>

    <script>
        // ========== ALERT DEBUG ==========
        function debugAlert(msg) {
            alert('[DEBUG] ' + msg);
        }
        function showDebugError(msg) {
            document.getElementById('debug-error').style.display = 'block';
            document.getElementById('debug-error').innerText = 'ERROR: ' + msg;
        }

        // ========== INCLUDE KODE DARI FILE-FILE EKSTERNAL (untuk debugging) ==========
        // Sebenarnya kita akan memuatnya via script tag, tapi untuk memastikan, kita akan muat satu per satu.
        // Tapi karena kita tidak bisa menulis ulang semua, saya akan gunakan script tag seperti biasa.
        // Namun kita tambahkan event listener untuk mendeteksi error loading.
    </script>

    <script src="js/constants.js" onerror="showDebugError('Gagal memuat constants.js')"></script>
    <script src="js/utils.js" onerror="showDebugError('Gagal memuat utils.js')"></script>
    <script src="js/globals.js" onerror="showDebugError('Gagal memuat globals.js')"></script>
    <script src="js/database.js" onerror="showDebugError('Gagal memuat database.js')"></script>
    <script src="js/ui.js" onerror="showDebugError('Gagal memuat ui.js')"></script>
    <script src="js/auth.js" onerror="showDebugError('Gagal memuat auth.js')"></script>
    <script src="js/data.js" onerror="showDebugError('Gagal memuat data.js')"></script>
    <script src="js/relasi.js" onerror="showDebugError('Gagal memuat relasi.js')"></script>

    <script>
        // Setelah semua script dimuat, kita cek apakah fungsi-fungsi penting ada
        window.addEventListener('load', function() {
            setTimeout(function() {
                if (typeof initDatabase !== 'function') showDebugError('initDatabase tidak ditemukan');
                if (typeof loadCustomers !== 'function') showDebugError('loadCustomers tidak ditemukan');
                if (typeof loadSuppliers !== 'function') showDebugError('loadSuppliers tidak ditemukan');
                if (typeof customers === 'undefined') showDebugError('customers tidak terdefinisi');
            }, 1000);
        });
    </script>
</body>
</html>
